targets:
  $default:
    builders:
      drift_dev:
        options:
          # Store dates as ISO-8601 text. The default (unix seconds) would drop
          # milliseconds, and entries recorded in the same second would lose
          # their order.
          store_date_time_values_as_text: true
          databases:
            app_database: lib/core/database/app_database.dart
          schema_dir: drift_schemas/
          test_dir: test/drift/
