name: vsla_ledger
description: "An offline-first Flutter app for Village Savings and Loan Associations (VSLAs)."
publish_to: 'none'
version: 0.1.0

environment:
  sdk: ^3.10.8

dependencies:
  cloud_firestore: ^6.7.1
  connectivity_plus: ^7.3.2
  drift: ^2.28.2
  drift_flutter: ^0.2.7
  firebase_core: ^4.15.0
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  flutter_riverpod: ^2.6.1
  flutter_secure_storage: ^11.2.0
  freezed_annotation: ^2.4.4
  go_router: ^17.5.0
  intl: any
  json_annotation: ^4.9.0
  pocketbase: ^0.25.2
  riverpod_annotation: ^2.6.1
  sqlite3_flutter_libs: ^0.5.42
  uuid: ^4.6.0
  workmanager: ^0.10.10

dev_dependencies:
  build_runner: ^2.4.0
  drift_dev: ^2.28.0
  fake_cloud_firestore: ^4.3.0
  flutter_lints: ^6.0.0
  flutter_test:
    sdk: flutter
  freezed: ^2.5.8
  http: ^1.6.0
  json_serializable: ^6.9.5
  mocktail: ^1.0.5
  riverpod_generator: ^2.6.4
  very_good_analysis: ^10.1.0

flutter:
  uses-material-design: true
  generate: true
